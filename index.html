<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escriptación de contraseñas</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="main">

        <section class="section1">
            <form action="" id="formularioAEnviar" class="main-formulario">
                <div class="main-formulario-div">
                    <label for="titulo">Titulo</label>
                    <input type="text" id="tituloNota">
                </div>
    
                <div class="main-formulario-div">
                    <label for="password">Contraseña</label>
                    <input type="password" id="contraseñaTexto">
                </div>
    
    
                <textarea class="main-formulario-textarea" name="texto" id="textoGrandeNota" cols="30" rows="10" placeholder="Aqui aparecera la nota o crearás la nota"></textarea>
    
                <div>
                    <button type="submit" id="guardar" class="main-formulario-divButton-guardar">Guardar nota</button>
                </div>

                <p>Colocar contraseña para desencriptar</p>

    
    
            </form>
        </section>
        <section class="section2 ">
            <form action="" id="formularioDeDesiscriptacion" class="main-formulario">
                <div>
                    <label for="contrasesaDesiscriptación">Colocar contraseña para Desencriptar</label>
                    <input type="text">
                </div>
                
                
                <button id="leerNota" class="main-formulario-divButton-desiscriptar">Desencriptar nota</button>
                <p>Añadir una nueva nota</p>
            </form>
        </section>

    </main>






    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.min.js"></script>
    <script src="./scripts.js"></script>
</body>

</html>
