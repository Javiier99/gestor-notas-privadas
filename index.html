<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escriptación de contraseñas</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <main class="main">

        <section class="section1">
            <form action="" id="formularioAEnviar" class="main-formulario">
                <div class="main-formulario-div">
                    <label for="titulo">Titulo</label>
                    <input type="text" id="tituloNota">
                </div>
    
    
                <textarea class="main-formulario-textarea" name="texto" id="textoGrandeNota" cols="30" rows="10" placeholder="Aqui aparecera la nota o crearás la nota"></textarea>
    
                <div>
                    <button type="submit" id="guardar" class="main-formulario-divButton-guardar">Guardar nota</button>
                </div>

                <ul class="main-formulario-listaErrores">

                </ul>

                <p>Ver todas las notas</p>

    
    
            </form>
        </section>
        <section class="section2 ">
            <form action="" id="formularioDeContraseñas" class="main-formulario">
                <div>
                    <label for="colocarLaContraseña">Colocar contraseña para ver todas las notas</label>
                    <input type="text" name="colocarLaContraseña">
                </div>
                
                
                <button id="leerNota" class="main-formulario-divButton-desiscriptar">Desencriptar nota</button>
                <p>Añadir una nueva nota</p>
            </form>
        </section>

    </main>




    <script src="./scripts.js"></script>
</body>

</html>
